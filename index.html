<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - อัจฉริยา โกฏแก้ว</title>
    <style>
        /* สไตล์หลัก (ใช้เหมือนกันทุกหน้า) */
        :root { --dark-gray: #1a1a1a; --mid-gray: #333333; --light-gray: #f9f9f9; --gold: #d4af37; }
        body { background-color: var(--mid-gray); color: #fff; font-family: 'Sarabun', Tahoma, sans-serif; margin: 0; text-align: center; }
        
        /* แถบเมนู */
        .navbar { background-color: var(--dark-gray); padding: 15px 0; border-bottom: 4px solid var(--gold); }
        .navbar a { color: var(--gold); text-decoration: none; padding: 10px 20px; font-weight: bold; margin: 0 10px; transition: 0.3s; }
        .navbar a:hover { color: #fff; border-bottom: 2px solid #fff; }
        
        /* เนื้อหาหน้าแรก */
        .content { padding: 80px 20px; }
        .profile-img { width: 220px; height: 220px; border-radius: 50%; border: 5px solid var(--gold); object-fit: cover; margin-bottom: 20px; }
        h1 { color: var(--gold); font-size: 36px; }
        .btn { display: inline-block; background-color: var(--gold); color: var(--dark-gray); padding: 12px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 30px; }
        .btn:hover { background-color: #fff; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">หน้าแรก</a>
        <a href="page2.html">ประวัติส่วนตัว</a>
        <a href="portfolio.html">ผลงาน</a>
        <a href="contact.html">ติดต่อ</a>
    </div>
    <div class="content">
        <img src="https://via.placeholder.com/220" alt="อัจฉริยา โกฏแก้ว" class="profile-img">
        <h1>นางสาวอัจฉริยา โกฏแก้ว</h1>
        <p style="font-size: 20px; font-weight: bold;">ยินดีต้อนรับสู่แฟ้มสะสมผลงานของฉัน(Portfolio)</p>
        <p style="color: #ccc;">"มารู้จักตัวตนและจุดมุ่งหมายในอนาคตของฉันกันเถอะ!"</p>
        <a href="page2.html" class="btn">ดูประวัติส่วนตัว ➔</a>
    </div>
</body>
</html>
